[platformio]
; Isolate framework packages from MqttBroker and all other projects.
core_dir = ${PROJECT_DIR}/.pio-core
default_envs = az-delivery-devkit-v4

[env:az-delivery-devkit-v4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = az-delivery-devkit-v4
framework = arduino, espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = post:scripts/windows_linker.py
lib_deps =
    tzapu/WiFiManager@2.0.17
    ayushsharma82/ElegantOTA@3.1.7
build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=0
    -D CORE_DEBUG_LEVEL=3

; The synchronous OTA server does not use the async web libraries.
lib_ignore =
    ESPAsyncWebServer
    AsyncTCP
; Keep only mDNS from the optional Arduino registry components.
custom_component_remove =
    espressif/esp_modem
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-dsp
    espressif/network_provisioning
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/qrcode
    espressif/esp-sr
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/libsodium
    espressif/esp-modbus
    joltwallet/littlefs
    chmorgan/esp-libhelix-mp3
    espressif/lan867x

